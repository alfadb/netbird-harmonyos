# NetBird HarmonyOS client core — native side (Rust/NAPI cdylib).
#
# Product skeleton promoted from the verified spike chain:
#   - boringtun pinned verbatim per spikes/n1b-disc-phys-hap/probe (frozen
#     build input): boringtun = { version = "=0.7.1", default-features = false,
#     features = ["ffi-bindings"] }, crate sha256 =
#     15dd6a8a89cbe8997f37ca0cf035e6ea4d64cd2ecea4aed83ffb9f99f7126939.
#   - The `device` feature STAYS DISABLED — now a binding fd-contract clause,
#     not just a probe freeze (docs/native-nx-governance.md §二 条款 2):
#     TunSocket::new treats a numeric name as an fd and Drop closes it
#     unconditionally, i.e. it would consume the platform raw fd whose ONLY
#     closer must be VpnConnection.destroy(). The TUN read/write path lives in
#     src/tun.rs instead: TunFd owns a dup copy (F_DUPFD_CLOEXEC, dup()
#     fallback), does raw read/write/poll on the copy only, and closes
#     exactly its own fd. Enabling `device` would also add socket2/thiserror
#     to the offline dependency set for zero contract-legal capability.
#   - Handwritten raw NAPI extern "C" declarations (src/napi.rs) resolved from
#     the host process (libace_napi.z.so); no napi-rs dependency, zero
#     napi_create_threadsafe_function / napi_create_async_work.
#
# panic=abort: panics must not unwind across the NAPI/extern "C" boundary.
[package]
name = "netbird_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "netbird_core"
# rlib: lets tests/tun_fd_contract.rs (integration-process tests) link the
# crate on the host; the shipped artifact remains the cdylib below.
crate-type = ["cdylib", "rlib"]

[dependencies]
boringtun = { version = "=0.7.1", default-features = false, features = ["ffi-bindings"] }
# N3-3 management envelope: NaCl crypto_box (X25519 + XSalsa20-Poly1305), the
# same primitive pair as upstream Go nacl/box (encryption/encryption.go).
# Cross-compile to aarch64-unknown-linux-ohos verified in the repo-external
# probe (~/harmonyos-signing/netbird-n1bdisc/refs/nacl-probe): exit 0.
crypto_box = "0.9.1"
# base64 for ServerKeyResponse.key / wgPubKey string forms; "0.22" unifies
# with the base64 0.22.1 already in the lock (boringtun) — no new major.
base64 = "0.22"
prost = "0.14"
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "0.14"

[profile.release]
panic = "abort"
opt-level = 2
debug = false
strip = "debuginfo"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
prost = "0.14"
prost-types = "0.14"
rcgen = "0.14.10"
tokio = { version = "1", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
